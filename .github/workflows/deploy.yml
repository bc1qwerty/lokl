name: Deploy
on:
  push:
    tags: ['v*']
  # Deploys were tag-only, so a fix to the build itself could not ship without
  # inventing a release. This lets the same job be run on demand.
  workflow_dispatch:
# ⚠2026-09-15: 배포가 겹칠 수 있었다. push 두 개가 연달아 들어오면 두 잡이 동시에
#   돌고, **먼저 시작한 쪽이 나중에 끝나면** 라이브가 옛 산출물로 되돌아간다
#   (릴리스 잡이라면 latest 태그가 역전된다). 러너 시간은 일정하지 않으므로 순서는
#   보장되지 않는다.
# ⚠`cancel-in-progress` 는 **false** 다. true 로 두면 돌던 배포·릴리스 업로드를
#   중간에 죽여 부분 산출물을 남길 수 있다. false 로도 «나중 푸시가 나중에 끝남»은
#   보장된다 — 대기열에는 최신 1건만 남는다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # Root build for lokl.txid.uk, which serves from the domain root.
      - run: npm run build

      # ⚠ 2026-09-16 신설. 이 워크플로는 태그(v*)와 수동 dispatch 로만 도는데,
      #   **태그는 CI 를 통과한 적 없는 커밋을 가리킬 수 있다.** ci.yml 이 테스트 15개를
      #   돌지만 그건 main·feature push 와 PR 에서만이고, 배포 경로에는 게이트가
      #   `npm run build`(tsc --noEmit + vite build) 하나뿐이었다 — 타입은 보지만
      #   동작은 안 본다. 라이브 사이트로 나가는 길에는 ci 와 같은 게이트를 둔다.
      #   ⚠순서는 ci.yml 과 맞춘다(build → test). 타입 오류가 더 빨리 드러난다.
      - run: npm run test
      - name: Sync dist to VPS (lokl.txid.uk)
        env:
          SSH_KEY: ${{ secrets.ORACLE_VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/key && chmod 600 ~/.ssh/key
          # ⚠ 2026-09-16: 예전에는 여기서 `ssh-keyscan` 으로 **매 실행 호스트 키를 새로
          #   받아** known_hosts 에 넣었다. 그러면 뒤의 StrictHostKeyChecking=yes 가
          #   무의미해진다 — 네트워크가 내주는 키를 그냥 믿는 것(매번 TOFU)이라,
          #   러너와 VPS 사이에 끼어든 상대가 배포 SSH 세션을 통째로 가로챌 수 있다.
          #   이 리포의 배포 키는 VPS 에 쓰기 권한이 있다.
          # ⚠ 호스트 키는 **비밀이 아니다**(누구나 ssh-keyscan 으로 받는다). 그래서
          #   시크릿이 아니라 여기 박는다 — 리뷰에서 눈으로 검증할 수 있는 편이 낫다.
          # ⚠ 지문 SHA256:5Zil4B0YrKEUeZ/lutm46GlZUZG+j8NlJYNBLlh/Cm4 — 2026-09-16 에
          #   세 경로로 대조했다: 서버의 /etc/ssh/ssh_host_ed25519_key.pub, 네트워크
          #   keyscan, 그리고 오래 쓰던 로컬 known_hosts. 셋이 일치한다.
          # ⚠ VPS 를 재구축하면 이 줄을 **반드시 갱신**해야 한다. 안 하면 배포가
          #   "REMOTE HOST IDENTIFICATION HAS CHANGED" 로 멈춘다 — 그게 맞는 동작이다.
          #   갱신값: ssh vps 'cut -d" " -f1,2 /etc/ssh/ssh_host_ed25519_key.pub'
          cat > ~/.ssh/known_hosts <<'KNOWN_HOSTS'
          158.180.91.252 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMaQu1wUyIrn2QN5pEgySAHsoF6ofdNoEJb/oA+/0K3o
          KNOWN_HOSTS
          rsync -az --delete -e "ssh -i ~/.ssh/key -o StrictHostKeyChecking=yes" dist/ ubuntu@158.180.91.252:/home/ubuntu/lokl.txid.uk/
      - name: Verify live site serves the new bundle
        run: |
          BUNDLE=$(grep -oE 'assets/index-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          if [ -z "$BUNDLE" ]; then echo "::error::no index bundle found in dist/index.html"; exit 1; fi
          echo "expecting bundle: $BUNDLE"
          LIVE=$(curl -fsSL -H 'Cache-Control: no-cache' "https://lokl.txid.uk/")
          if echo "$LIVE" | grep -qF "$BUNDLE"; then
            echo "OK: live site serves $BUNDLE"
          else
            echo "::error::live https://lokl.txid.uk/ does not reference $BUNDLE"
            exit 1
          fi

      # ⚠ GitHub Pages 미러(bc1qwerty.github.io/lokl)는 2026-09-05 은퇴했다.
      # 그 origin 은 api.txid.uk CORS 허용 목록 밖이라 라이트닝 로그인·동기화
      # (auth/me·challenge 등)가 전부 CORS 로 차단됐다 — 사용자가 미러 URL 로
      # 접속해 "Failed to fetch" 를 겪었다. 정본은 lokl.txid.uk 하나이고,
      # gh-pages 브랜치에는 lokl.txid.uk 로 보내는 리다이렉트 스텁만 배포한다
      # (해시 경로 보존). 앱을 다시 gh-pages 에 올리려면 그 전에 api CORS 에
      # https://bc1qwerty.github.io 를 추가해야 한다(그 origin 은 다른 Pages
      # 프로젝트와 공유되니 credentials 허용 범위 확대를 감수할 때만).
      - name: Publish redirect stub to GitHub Pages (mirror retired)
        # ⚠시크릿을 run 스크립트에 직접 보간하지 않고 env 로 넘긴다. GITHUB_TOKEN 은
        #   로그에서 마스킹되지만, 문자열 치환은 값에 따옴표가 섞이면 셸 문법이 된다.
        env:
          GH_PAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p gh-redirect
          cat > gh-redirect/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Lokl moved to lokl.txid.uk</title>
          <meta http-equiv="refresh" content="0; url=https://lokl.txid.uk/">
          <link rel="canonical" href="https://lokl.txid.uk/">
          <meta name="robots" content="noindex">
          <script>location.replace('https://lokl.txid.uk/' + (location.hash || ''));</script>
          </head><body><p>Lokl은 <a href="https://lokl.txid.uk/">lokl.txid.uk</a>로 이전했습니다. 이동 중…</p></body></html>
          HTML
          cp gh-redirect/index.html gh-redirect/404.html
          git config --global user.name "github-actions-bot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_PAGES_TOKEN}@github.com/${{ github.repository }}.git"
          npx gh-pages -d gh-redirect --message "chore: keep mirror redirecting to lokl.txid.uk"
