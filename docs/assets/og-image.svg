<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og-image.png — render: rsvg-convert -w 1200 -h 630 og-image.svg -o og-image.png -->
  <rect width="1200" height="630" fill="#0d1117"/>
  <!-- subtle top accent line -->
  <rect x="0" y="0" width="1200" height="6" fill="#f7931a"/>
  <!-- logo mark: rounded square with L, echoing favicon -->
  <rect x="92" y="150" width="120" height="120" rx="24" fill="#161b22" stroke="#f7931a" stroke-width="3"/>
  <text x="152" y="238" font-family="Roboto, 'DejaVu Sans', sans-serif" font-size="72" font-weight="700" fill="#f7931a" text-anchor="middle">L</text>
  <!-- wordmark -->
  <text x="248" y="240" font-family="Roboto, 'DejaVu Sans', sans-serif" font-size="96" font-weight="700" fill="#e6edf3">Lokl</text>
  <!-- tagline -->
  <text x="96" y="360" font-family="Roboto, 'DejaVu Sans', sans-serif" font-size="40" fill="#9da7b3">Browser-based, offline-first personal knowledge base</text>
  <text x="96" y="420" font-family="Roboto, 'DejaVu Sans', sans-serif" font-size="40" fill="#f7931a">Your files never leave your device.</text>
  <!-- url footer -->
  <text x="96" y="540" font-family="Roboto, 'DejaVu Sans', sans-serif" font-size="30" fill="#58a6ff">lokl.txid.uk</text>
</svg>
